<svg id="gd3" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="graphics-document document" aria-roledescription="quadrantChart" style="max-width: 500px;"><style>#gd3{font-family:&quot;trebuchet ms&quot;,verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#gd3 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#gd3 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#gd3 .error-icon{fill:#552222;}#gd3 .error-text{fill:#552222;stroke:#552222;}#gd3 .edge-thickness-normal{stroke-width:1px;}#gd3 .edge-thickness-thick{stroke-width:3.5px;}#gd3 .edge-pattern-solid{stroke-dasharray:0;}#gd3 .edge-thickness-invisible{stroke-width:0;fill:none;}#gd3 .edge-pattern-dashed{stroke-dasharray:3;}#gd3 .edge-pattern-dotted{stroke-dasharray:2;}#gd3 .marker{fill:#333333;stroke:#333333;}#gd3 .marker.cross{stroke:#333333;}#gd3 svg{font-family:&quot;trebuchet ms&quot;,verdana,arial,sans-serif;font-size:16px;}#gd3 p{margin:0;}#gd3 .node .neo-node{stroke:#9370DB;}#gd3 [data-look=&quot;neo&quot;].node rect,#gd3 [data-look=&quot;neo&quot;].cluster rect,#gd3 [data-look=&quot;neo&quot;].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#gd3 [data-look=&quot;neo&quot;].swimlane.cluster rect{filter:none;}#gd3 [data-look=&quot;neo&quot;].node path{stroke:#9370DB;stroke-width:1px;}#gd3 [data-look=&quot;neo&quot;].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#gd3 [data-look=&quot;neo&quot;].node .neo-line path{stroke:#9370DB;filter:none;}#gd3 [data-look=&quot;neo&quot;].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#gd3 [data-look=&quot;neo&quot;].node circle .state-start{fill:#000000;}#gd3 [data-look=&quot;neo&quot;].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#gd3 [data-look=&quot;neo&quot;].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#gd3 :root{--mermaid-font-family:&quot;trebuchet ms&quot;,verdana,arial,sans-serif;}</style><g></g><g class="main"><g class="quadrants"><g class="quadrant"><rect x="263" y="45" width="232" height="212" fill="#ECECFF"></rect><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 50) rotate(0)">Critical Risks</text></g><g class="quadrant"><rect x="31" y="45" width="232" height="212" fill="#f1f1ff"></rect><text x="0" y="0" fill="#0e0e00" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 50) rotate(0)">Major Risks</text></g><g class="quadrant"><rect x="31" y="257" width="232" height="212" fill="#f6f6ff"></rect><text x="0" y="0" fill="#090900" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 262) rotate(0)">Minor Risks</text></g><g class="quadrant"><rect x="263" y="257" width="232" height="212" fill="#fbfbff"></rect><text x="0" y="0" fill="#040400" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 262) rotate(0)">Monitor Risks</text></g></g><g class="border"><line x1="30" y1="45" x2="496" y2="45" style="stroke:hsl(240, 60%, 86.2745098039%);stroke-width:2"></line><line x1="495" y1="46" x2="495" y2="468" style="stroke:hsl(240, 60%, 86.2745098039%);stroke-width:2"></line><line x1="30" y1="469" x2="496" y2="469" style="stroke:hsl(240, 60%, 86.2745098039%);stroke-width:2"></line><line x1="31" y1="46" x2="31" y2="468" style="stroke:hsl(240, 60%, 86.2745098039%);stroke-width:2"></line><line x1="263" y1="46" x2="263" y2="468" style="stroke:hsl(240, 60%, 86.2745098039%);stroke-width:1"></line><line x1="32" y1="257" x2="494" y2="257" style="stroke:hsl(240, 60%, 86.2745098039%);stroke-width:1"></line></g><g class="data-points"><g class="data-point"><circle cx="123.8" cy="129.79999999999998" r="5" fill="hsl(240, 100%, NaN%)" stroke="hsl(240, 100%, NaN%)" stroke-width="0px"></circle><text x="0" y="0" fill="#131300" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(123.8, 134.79999999999998) rotate(0)">R-005: Cloud Cost Overrun</text></g><g class="data-point"><circle cx="355.8" cy="341.79999999999995" r="5" fill="hsl(240, 100%, NaN%)" stroke="hsl(240, 100%, NaN%)" stroke-width="0px"></circle><text x="0" y="0" fill="#131300" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(355.8, 346.79999999999995) rotate(0)">R-004: Duplicate Enrollment</text></g><g class="data-point"><circle cx="263" cy="257" r="5" fill="hsl(240, 100%, NaN%)" stroke="hsl(240, 100%, NaN%)" stroke-width="0px"></circle><text x="0" y="0" fill="#131300" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(263, 262) rotate(0)">R-003: Notification Delivery Failure</text></g><g class="data-point"><circle cx="216.6" cy="214.60000000000002" r="5" fill="hsl(240, 100%, NaN%)" stroke="hsl(240, 100%, NaN%)" stroke-width="0px"></circle><text x="0" y="0" fill="#131300" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(216.6, 219.60000000000002) rotate(0)">R-002: QR Attendance Failure</text></g><g class="data-point"><circle cx="170.2" cy="87.39999999999999" r="5" fill="hsl(240, 100%, NaN%)" stroke="hsl(240, 100%, NaN%)" stroke-width="0px"></circle><text x="0" y="0" fill="#131300" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(170.2, 92.39999999999999) rotate(0)">R-001: Data Leakage</text></g></g><g class="labels"><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 479) rotate(0)">Low Probability</text></g><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 479) rotate(0)">High Probability</text></g><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 363) rotate(-90)">Low Impact</text></g><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 151) rotate(-90)">High Impact</text></g></g><g class="title"><text x="0" y="0" fill="#131300" font-size="20" dominant-baseline="hanging" text-anchor="middle" transform="translate(250, 10) rotate(0)">Risk Assessment Matrix (Probability vs Impact)</text></g></g></svg>