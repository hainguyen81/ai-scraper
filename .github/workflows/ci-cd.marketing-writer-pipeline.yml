name: ✍️ Agent - Execute Marketing AI Content Writer

# Trigger the workflow when requirements change or via manual trigger
on:
  workflow_dispatch:
    inputs:
      idea:
        description: |
          📁 Project Name / 💡 Idea
          (Storage: sources/storage/ideas or sources/requirements)
        required: true
        type: string
      platform:
        description: |
          👥 Social Platform
        required: false
        default: '💬 General'
        type: choice
        options:
          - "👍 Facebook"
          - "🐦 Twitter"
          - "💼 Linked-in"
          - "🌀 Threads"
          - "📸 Instagram"
          - "💬 General"
      language:
        description: '🗣️ Estimation Language'
        required: false
        default: '🇺🇸 English'
        type: choice
        options:
          - "🇻🇳 Vietnamese"
          - "🇺🇸 English"
          - "🇩🇪 Germany"
          - "🇯🇵 Japanese"
      verbose:
        description: '🐞 Verbose'
        required: false
        default: false
        type: boolean
    
  # allow other workflow call into (inputs same as workflow_dispatch but required)
  workflow_call:
    inputs:
      idea:
        description: |
          📁 Project Name / 💡 Idea
          (Storage: sources/storage/ideas or sources/requirements)
        required: true
        type: string
      platform:
        description: |
          👥 Social Platform
        required: false
        default: '💬 General'
        type: string
      language:
        description: '🗣️ Estimation Language'
        required: false
        default: '🇺🇸 English'
        type: string
      verbose:
        description: '🐞 Verbose'
        required: false
        default: false
        type: boolean

# permissions for GitHub Actions READ/WRITE
permissions:
  actions: write
  contents: write
  packages: write

# enviroment
env:
  LANG: 'C.UTF-8'
  LC_ALL: 'C.UTF-8'

jobs:
  # 🏗️ System Architecture & Phase Planner
  generate-blueprint:
    name: ✍️ Expert Principal Marketing Content Writer
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the repository code into the runner workspace
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7
        with:
            fetch-depth: 0

      # Step 2: Initialize a clean Python runtime environment
      - name: 🐍 Set up Python Environment
        if: success()                             # if previous step is successful
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Step 3: Upgrade pip and install the official Google GenAI SDK
      - name: 📦 Install Python Dependencies
        if: success()                             # if previous step is successful
        run: |
          # from `requirements.txt`
          python -m pip install --upgrade pip
          pip install -r requirements.txt --upgrade

      # Step 4: Execute agent
      - name: ✍️ Execute Expert Principal Marketing Content Writer
        if: success()                             # if previous step is successful
        env:
          # Secrets contains the AI endpoint and AI API key JSON
          AI_MODELS_KEYS_JSON: ${{ secrets.AI_MODELS_KEYS_JSON }}
          
          # Python environment
          PYTHONPATH: ${{ github.workspace }} # force Python load folder structure, including 'sources'
          
          # Project Information
          INPUTS_IDEA: ${{ inputs.idea }}
          INPUTS_PLATFORM: ${{ inputs.platform }}
          INPUTS_LANGUAGE: ${{ inputs.language }}
          INPUTS_VERBOSE: ${{ inputs.verbose == true && '--verbose' || '' }}
        run: |
          echo "⚡ Kicking off Expert Principal Marketing AI Content Writer..."
          python sources/agents/marketing/agent_writer.py \
              --idea "$INPUTS_IDEA" \
              --language "$INPUTS_LANGUAGE" \
              --platform "$INPUTS_PLATFORM" \
              $INPUTS_VERBOSE

      # Step 5: Automatically stage, commit, and push changes
      - name: 🚀 Commit and Push Changes
        if: always()
        env:
          INPUTS_IDEA: ${{ inputs.idea }}
          INPUTS_PLATFORM: ${{ inputs.platform }}
          INPUTS_LANGUAGE: ${{ inputs.language }}
        run: |
          # 1. Bot user GitHub
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 2. Add everything into Stage
          git add .
          
          # 3. Use status to check file changes
          if [ -n "$(git status --porcelain)" ]; then
            echo "📝 Committing system state changes..."
            git commit -m "chore(ai): auto-generate some expert SRS for [ $INPUTS_IDEA ] under [ $INPUTS_LANGUAGE ] for [ $INPUTS_PLATFORM ] [skip ci]"
            
            # ✅ ENTERPRISE HOTFIX: Pull new changes and rebase to avoid conflicts fast-forward
            echo "🔄 Pulling latest upstream tree and executing explicit contextual rebase..."
            git pull --rebase -X theirs origin ${{ github.ref_name }}
            
            # 💡 Use github.ref_name to push safely
            echo "📤 Pushing secure data changes upstream to repository branch..."
            git push origin HEAD:${{ github.ref_name }}
            echo "🎯 Success! Architecture files successfully committed and pushed back to the repository."
          
          else
            echo "ℹ️ Notice: No architecture structural updates or modifications were detected."
          fi
